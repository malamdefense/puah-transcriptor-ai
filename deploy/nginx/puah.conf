# Reverse proxy for the Puah transcription system.
# The API listens on 127.0.0.1:8000; nginx exposes it over HTTPS to the internal network only.

server {
    listen 80;
    server_name puah-transcribe.internal;
    return 301 https://$host$request_uri;          # Redirect HTTP to HTTPS
}

server {
    listen 443 ssl;
    server_name puah-transcribe.internal;

    ssl_certificate     /etc/ssl/puah/fullchain.pem;
    ssl_certificate_key /etc/ssl/puah/privkey.pem;

    # Critical: uploads up to 2GB (matches PUAH_MAX_UPLOAD_MB). Default of nginx is 1MB.
    client_max_body_size 2048m;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Long-running processing and uploads
        proxy_read_timeout   3600s;
        proxy_send_timeout   3600s;
        proxy_request_buffering off;   # Large uploads stream directly to the application

        # ⚠️ No built-in authentication in the application — enable it here (or limit to internal network/VPN):
        # auth_basic           "Puah";
        # auth_basic_user_file /etc/nginx/puah.htpasswd;   # Created with: htpasswd -c ...
    }
}
