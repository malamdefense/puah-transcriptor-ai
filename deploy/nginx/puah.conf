# Reverse proxy ל-מערכת התמלול של פוע"ה.
# ה-API מאזין ל-127.0.0.1:8000; nginx חושף אותו ב-HTTPS לרשת הפנימית בלבד.

server {
    listen 80;
    server_name puah-transcribe.internal;
    return 301 https://$host$request_uri;          # הפניית HTTP ל-HTTPS
}

server {
    listen 443 ssl;
    server_name puah-transcribe.internal;

    ssl_certificate     /etc/ssl/puah/fullchain.pem;
    ssl_certificate_key /etc/ssl/puah/privkey.pem;

    # קריטי: העלאות עד 2GB (תואם PUAH_MAX_UPLOAD_MB). ברירת המחדל של nginx היא 1MB.
    client_max_body_size 2048m;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # עיבוד והעלאות ארוכות
        proxy_read_timeout   3600s;
        proxy_send_timeout   3600s;
        proxy_request_buffering off;   # זרימת העלאות גדולות ישירות לאפליקציה

        # ⚠️ אין אימות מובנה באפליקציה — הפעילו אימות כאן (או הגבילו לרשת/VPN):
        # auth_basic           "Puah";
        # auth_basic_user_file /etc/nginx/puah.htpasswd;   # נוצר עם: htpasswd -c ...
    }
}
